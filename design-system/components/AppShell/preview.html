<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>AppShell</title>
<style>#root{padding:var(--space-4)}</style></head>
<body>
<div id="root" style="padding:0"></div>
<script>
var H = window.Hackerspace, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h(H.AppShell, {
    nav: [{label:'Explorar',active:true},{label:'Equipos'},{label:'Proyectos'},{label:'Mis hackathones',count:2}],
    actions: h(React.Fragment,null, h(H.Button,{variant:'ghost',icon:'bell','aria-label':'Notificaciones'}), h(H.Avatar,{name:'Camila Rojas',online:true,size:'sm'})),
    banner: 'Santiago Hacks comienza en 2 días. Ya hay 312 inscritos.',
    aside: h(H.Card,null, h('strong',null,'Ahora en Hackerspace'), h(H.PresencePill,{count:148})),
  },
    h(H.PageHeader,{eyebrow:'Explorar',title:'Hackathones cerca de ti',description:'Presenciales primero. Virtuales también.'}),
    h(H.Grid,{min:220}, h(H.Card,null,'Tarjeta'), h(H.Card,null,'Tarjeta'), h(H.Card,null,'Tarjeta'))
  ));
</script>
</body>
</html>
