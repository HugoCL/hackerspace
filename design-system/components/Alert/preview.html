<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Alert</title>
<style>#root{padding:var(--space-4)}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Hackerspace, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h(H.Stack,{gap:2,style:{maxWidth:560}},
    h(H.Alert,{title:'Las inscripciones cierran el 10 de marzo'},'Después de esa fecha no se pueden sumar integrantes al equipo.'),
    h(H.Alert,{tone:'live',title:'La entrega está abierta',action:h(H.Button,{size:'sm'},'Entregar proyecto')},'Tu equipo tiene hasta las 18:00 para subir el proyecto.'),
    h(H.Alert,{tone:'success',title:'Ya eres parte de Los Compiladores'}),
    h(H.Alert,{tone:'danger',title:'No pudimos enviar tu postulación'},'Revisa tu conexión y vuelve a intentarlo.')));
</script>
</body>
</html>
