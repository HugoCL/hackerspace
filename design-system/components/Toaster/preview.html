<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Toaster</title>
<style>#root{padding:var(--space-4)}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Hackerspace, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h(H.Stack,{gap:4},
    h(H.Toaster,{inline:true,items:[
      {id:1,tone:'live',actor:{name:'Camila Rojas'},title:'Camila se unió a tu equipo',action:{label:'Ver equipo'}},
      {id:2,actor:{name:'scout',agent:true},title:'Encontró 3 hackathones nuevas cerca de ti'},
      {id:3,title:'Proyecto publicado'}]}),
    h('div',null, h(H.Button,{onClick:function(){ H.toast({tone:'live',actor:{name:'Diego Muñoz'},title:'Diego está viendo tu proyecto'}); }},'Lanzar un aviso')),
    h(H.Toaster)));
</script>
</body>
</html>
