<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Countdown</title>
<style>#root{padding:var(--space-4)}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Hackerspace, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h(H.Stack,{direction:'row',gap:6,align:'center',wrap:true},
    h(H.Countdown,{label:'Comienza en',to:Date.now()+2*86400000+5049000}),
    h(H.Countdown,{label:'Entrega en',to:Date.now()+3725000}),
    h(H.Countdown,{label:'Inscripciones',to:Date.now()-1000,doneLabel:'CERRADAS'})));
</script>
</body>
</html>
