<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Drawer</title>
<style>#root{padding:var(--space-4)}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Hackerspace, h = React.createElement;
function Demo(){
  var a = React.useState(false);
  return h(React.Fragment,null,
    h(H.Button,{onClick:function(){a[1](true);}},'Filtros'),
    h(H.Drawer,{open:a[0],onClose:function(){a[1](false);},title:'Filtrar hackathones',
      footer:h(React.Fragment,null,h(H.Button,{variant:'ghost',onClick:function(){a[1](false);}},'Limpiar'),h(H.Button,{variant:'primary',onClick:function(){a[1](false);}},'Aplicar filtros'))},
      h(H.SegmentedControl,{label:'Modalidad',options:['Todas','Presenciales','Virtuales']}),
      h(H.Select,{label:'Fecha',options:['Cualquier fecha','Este mes','Próximos 3 meses']}),
      h(H.Checkbox,{label:'Solo con equipos buscando gente'}),
      h(H.Checkbox,{label:'Solo con premios'})));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
