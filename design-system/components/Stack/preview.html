<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Stack</title>
<style>#root{padding:var(--space-4)}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Hackerspace, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h(H.Stack,{gap:4},
    h(H.Stack,{direction:'row',gap:2,align:'center',wrap:true}, h(H.Badge,null,'IA'), h(H.Badge,null,'Datos abiertos'), h(H.Badge,{tone:'virtual'},'Virtual')),
    h(H.Stack,{direction:'row',gap:2}, h(H.Button,{variant:'primary'},'Inscribirme'), h(H.Button,null,'Compartir'))));
</script>
</body>
</html>
