<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Popover</title>
<style>#root{padding:var(--space-4)}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Hackerspace, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h(H.Popover,{label:h(React.Fragment,null,h(H.Icon,{name:'users'}),'23 viendo'),title:'Viendo ahora'},
    h(H.Stack,{gap:2}, ['Camila Rojas','Diego Muñoz','Ana Pérez'].map(function(n){ return h(H.Stack,{key:n,direction:'row',gap:2,align:'center'}, h(H.Avatar,{name:n,size:'sm',online:true}), n); }), h('span',{style:{color:'var(--ui-muted-foreground)',fontSize:13}},'y 20 personas más'))));
</script>
</body>
</html>
