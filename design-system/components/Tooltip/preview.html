<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Tooltip</title>
<style>#root{padding:var(--space-4)}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Hackerspace, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h('div',{style:{paddingTop:28}}, h(H.Stack,{direction:'row',gap:4,align:'center'},
    h(H.Tooltip,{label:'Notificaciones'}, h(H.Button,{icon:'bell','aria-label':'Notificaciones'})),
    h(H.Tooltip,{label:'Guardar hackathon'}, h(H.Button,{icon:'heart','aria-label':'Guardar hackathon'})),
    h(H.Tooltip,{label:'Creado por un agente',side:'bottom'}, h('span',{tabIndex:0}, h(H.AgentTag,{name:'scout'}))))));
</script>
</body>
</html>
