<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>AvatarStack</title>
<style>#root{padding:var(--space-4)}</style></head>
<body>
<div id="root"></div>
<script>
var H = window.Hackerspace, h = React.createElement;
var p=['Camila Rojas','Diego Muñoz','Ana Pérez','Tomás Vera','Sofía Lagos','Iván Soto'];
ReactDOM.createRoot(document.getElementById('root')).render(
  h(H.Stack,{direction:'row',gap:6,align:'center'}, h(H.AvatarStack,{people:p,total:48}), h(H.AvatarStack,{people:p.slice(0,3),size:'xs'})));
</script>
</body>
